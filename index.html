<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05090d">
  <meta name="description" content="Riess Axiom Global — a new perspective. Built with purpose.">
  <title>Riess Axiom Global</title>
  <style>
    :root { color-scheme: dark; --bg:#05090d; --panel:#0a131b; --cyan:#20d9f5; --silver:#c4d0d8; --muted:#82939e; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% 38%, #10232d 0%, #081119 38%, var(--bg) 76%); color:#f4f8fa; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display:grid; place-items:center; overflow:hidden; }
    body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.16; background-image:linear-gradient(rgba(32,217,245,.12) 1px, transparent 1px),linear-gradient(90deg,rgba(32,217,245,.12) 1px,transparent 1px); background-size:64px 64px; mask-image:radial-gradient(ellipse at center,black,transparent 76%); }
    main { width:min(900px, calc(100% - 40px)); text-align:center; padding:76px 24px; position:relative; }
    .mark { width:76px; height:76px; margin:0 auto 34px; border:1px solid rgba(32,217,245,.6); border-radius:22px; display:grid; place-items:center; color:var(--cyan); font-size:34px; font-weight:300; box-shadow:0 0 42px rgba(32,217,245,.13), inset 0 0 24px rgba(32,217,245,.07); transform:rotate(-8deg); }
    .eyebrow { color:var(--cyan); font-size:11px; letter-spacing:.34em; text-transform:uppercase; margin:0 0 18px; }
    h1 { margin:0; font-size:clamp(36px,7vw,76px); line-height:1.02; letter-spacing:-.055em; font-weight:650; }
    h1 span { display:block; color:var(--silver); font-weight:350; letter-spacing:.015em; font-size:.72em; margin-top:12px; }
    .rule { width:74px; height:2px; margin:34px auto 28px; background:var(--cyan); box-shadow:0 0 18px var(--cyan); }
    .message { color:#b4c2ca; font-size:clamp(15px,2vw,18px); line-height:1.8; max-width:560px; margin:0 auto; }
    .status { display:inline-flex; align-items:center; gap:10px; margin-top:46px; padding:11px 16px; border:1px solid rgba(196,208,216,.18); border-radius:999px; background:rgba(10,19,27,.72); color:#aebdc5; font-size:11px; letter-spacing:.18em; text-transform:uppercase; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--cyan); box-shadow:0 0 12px var(--cyan); }
    footer { position:fixed; bottom:24px; left:0; right:0; text-align:center; color:#60717b; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
    @media (prefers-reduced-motion:no-preference) { .mark { animation:float 6s ease-in-out infinite; } @keyframes float { 0%,100%{transform:translateY(0) rotate(-8deg)} 50%{transform:translateY(-7px) rotate(-5deg)} } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">A</div>
    <p class="eyebrow">Independent vision · Global outlook</p>
    <h1>RIESS AXIOM <span>GLOBAL</span></h1>
    <div class="rule"></div>
    <p class="message">A new venture is taking shape.<br>Built with purpose. Focused on what comes next.</p>
    <div class="status"><span class="dot"></span> Official website · Coming soon</div>
  </main>
  <footer>© <span id="year">2026</span> Riess Axiom Global</footer>
</body>
</html>
